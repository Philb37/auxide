<!-- @dsCard group="Brand" viewport="700x150" subtitle="Sheets slide on a soft spring; scrims fade" name="Motion" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-app)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw i{display:block;height:52px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(60,40,20,.06)}.sw b{font:var(--type-field-label)}.sw s{text-decoration:none;font:500 10px/1.3 ui-monospace,monospace;color:var(--text-muted)}.mono{font:500 11px ui-monospace,monospace;color:var(--text-muted)}</style></head><body><style>@keyframes up{0%,15%{transform:translateY(100%)}45%,85%{transform:translateY(0)}100%{transform:translateY(100%)}}</style><div style="display:flex;gap:24px;align-items:center"><div style="width:120px;height:100px;border-radius:18px;background:var(--surface-canvas);position:relative;overflow:hidden"><div style="position:absolute;left:6px;right:6px;bottom:0;height:64px;border-radius:16px 16px 0 0;background:var(--surface-app);box-shadow:var(--shadow-sheet);animation:up 2.6s var(--ease-sheet) infinite"></div></div><div class="mono" style="line-height:1.7">transform .3s cubic-bezier(.2,.8,.2,1)<br>scrim opacity .25s → rgba(42,36,32,.42)<br>close: wait 280ms, then unmount<br>toast auto-hides after 4.5s</div></div></body></html>
