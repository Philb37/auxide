<!-- @dsCard group="Colors" viewport="700x260" subtitle="Income / left / settled vs over / delete" name="Positive & negative" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-app)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw i{display:block;height:52px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(60,40,20,.06)}.sw b{font:var(--type-field-label)}.sw s{text-decoration:none;font:500 10px/1.3 ui-monospace,monospace;color:var(--text-muted)}.mono{font:500 11px ui-monospace,monospace;color:var(--text-muted)}</style></head><body><div class="r"><div class="sw"><i style="background:var(--ax-pos)"></i><b>Sync dot</b><s>--ax-pos</s></div><div class="sw"><i style="background:var(--ax-pos-text)"></i><b>Pos text</b><s>--ax-pos-text</s></div><div class="sw"><i style="background:var(--ax-pos-income)"></i><b>Income</b><s>--ax-pos-income</s></div><div class="sw"><i style="background:var(--ax-pos-soft)"></i><b>Settle bg</b><s>--ax-pos-soft</s></div><div class="sw"><i style="background:var(--ax-pos-chip)"></i><b>Left chip</b><s>--ax-pos-chip</s></div><div class="sw"><i style="background:var(--ax-pos-banner)"></i><b>Banner</b><s>--ax-pos-banner</s></div><div class="sw"><i style="background:var(--ax-pos-ink)"></i><b>Pos ink</b><s>--ax-pos-ink</s></div></div><div class="r" style="margin-top:12px"><div class="sw"><i style="background:var(--ax-neg)"></i><b>Destructive</b><s>--ax-neg</s></div><div class="sw"><i style="background:var(--ax-neg-bar)"></i><b>Over bar</b><s>--ax-neg-bar</s></div><div class="sw"><i style="background:var(--ax-neg-text)"></i><b>Over text</b><s>--ax-neg-text</s></div><div class="sw"><i style="background:var(--ax-neg-soft)"></i><b>Delete bg</b><s>--ax-neg-soft</s></div><div class="sw"><i style="background:var(--ax-neg-chip)"></i><b>Over chip</b><s>--ax-neg-chip</s></div><div class="sw"><i style="background:var(--ax-neg-ink)"></i><b>Neg ink</b><s>--ax-neg-ink</s></div></div></body></html>
