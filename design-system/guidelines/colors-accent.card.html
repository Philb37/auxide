<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-app)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw i{display:block;height:52px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(60,40,20,.06)}.sw b{font:var(--type-field-label)}.sw s{text-decoration:none;font:500 10px/1.3 ui-monospace,monospace;color:var(--text-muted)}.mono{font:500 11px ui-monospace,monospace;color:var(--text-muted)}</style></head><body><div class="r"><div class="sw"><i style="background:var(--ax-accent)"></i><b>Accent</b><s>--ax-accent</s></div><div class="sw"><i style="background:var(--ax-accent-glow)"></i><b>Glow</b><s>--ax-accent-glow</s></div><div class="sw"><i style="background:var(--ax-accent-text)"></i><b>Link</b><s>--ax-accent-text</s></div><div class="sw"><i style="background:var(--ax-accent-strong)"></i><b>Strong</b><s>--ax-accent-strong</s></div><div class="sw"><i style="background:var(--ax-accent-soft)"></i><b>Soft (hero)</b><s>--ax-accent-soft</s></div><div class="sw"><i style="background:var(--ax-accent-tile)"></i><b>Tile</b><s>--ax-accent-tile</s></div><div class="sw"><i style="background:var(--ax-accent-ink)"></i><b>Ink on soft</b><s>--ax-accent-ink</s></div><div class="sw"><i style="background:var(--ax-accent-on-dark)"></i><b>Undo</b><s>--ax-accent-on-dark</s></div></div></body></html>
