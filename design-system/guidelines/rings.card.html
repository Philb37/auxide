<!-- @dsCard group="Spacing" viewport="700x130" subtitle="Selection is shown with inset rings, not borders" name="Rings" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-app)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw i{display:block;height:52px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(60,40,20,.06)}.sw b{font:var(--type-field-label)}.sw s{text-decoration:none;font:500 10px/1.3 ui-monospace,monospace;color:var(--text-muted)}.mono{font:500 11px ui-monospace,monospace;color:var(--text-muted)}</style></head><body><div class="r" style="gap:16px;align-items:center"><div style="width:150px;height:56px;border-radius:22px;background:#fff;box-shadow:var(--ring-selected)"></div><span style="padding:8px 12px;border-radius:12px;background:#fff;box-shadow:var(--ring-input);font:var(--type-row)">e.g. Uber</span><span style="padding:9px 14px;border-radius:999px;background:oklch(0.94 0.045 145);color:oklch(0.42 0.09 145);box-shadow:inset 0 0 0 2px oklch(0.78 0.11 145);font:var(--type-label)">Groceries</span><span style="width:32px;height:32px;border-radius:12px;background:oklch(0.78 0.11 215);box-shadow:0 0 0 3px #fbf7f1,0 0 0 5px oklch(0.42 0.09 215)"></span><span style="width:76px;height:36px;border-radius:12px;background:var(--surface-inset);box-shadow:var(--ring-inset)"></span></div></body></html>
