<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Soft, brown-tinted; accent buttons glow in their own colour" name="Shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-app)}.r{display:flex;flex-wrap:wrap;gap:12px}.sw{display:flex;flex-direction:column;gap:6px;width:92px}.sw i{display:block;height:52px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(60,40,20,.06)}.sw b{font:var(--type-field-label)}.sw s{text-decoration:none;font:500 10px/1.3 ui-monospace,monospace;color:var(--text-muted)}.mono{font:500 11px ui-monospace,monospace;color:var(--text-muted)}</style></head><body><div class="r" style="gap:20px;padding:6px"><div class="sw" style="width:66px"><i style="height:54px;background:#fff;box-shadow:var(--shadow-card);border-radius:16px"></i><b>card</b></div><div class="sw" style="width:66px"><i style="height:54px;background:#fff;box-shadow:var(--shadow-raised);border-radius:16px"></i><b>raised</b></div><div class="sw" style="width:66px"><i style="height:54px;background:#fff;box-shadow:var(--shadow-seg);border-radius:16px"></i><b>seg</b></div><div class="sw" style="width:66px"><i style="height:54px;background:#fff;box-shadow:var(--shadow-key);border-radius:16px"></i><b>key</b></div><div class="sw" style="width:66px"><i style="height:54px;background:var(--ax-accent);box-shadow:var(--shadow-accent);border-radius:16px"></i><b>accent</b></div><div class="sw" style="width:66px"><i style="height:54px;background:var(--ax-accent);box-shadow:var(--shadow-fab);border-radius:16px"></i><b>fab</b></div><div class="sw" style="width:66px"><i style="height:54px;background:#fff;box-shadow:var(--shadow-sheet);border-radius:16px"></i><b>sheet</b></div><div class="sw" style="width:66px"><i style="height:54px;background:var(--ax-ink);box-shadow:var(--shadow-toast);border-radius:16px"></i><b>toast</b></div></div></body></html>
