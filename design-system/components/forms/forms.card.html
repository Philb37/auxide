<!-- @dsCard group="Components" viewport="700x470" name="Forms" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds/loader.js"></script>
<style>body{padding:20px}.l{font:500 11px ui-monospace,monospace;color:var(--text-subtle);margin-bottom:6px}</style></head><body><div id="root"></div>
<script type="text/babel">
AuxideReady.then(function(ns){const {FieldCard,AmountInput,MoneyInput,ChoiceCard,HuePicker}=ns;
const Row=({label,children,gap=10})=><div style={{marginBottom:16}}><div className="l">{label}</div><div style={{display:'flex',flexWrap:'wrap',gap,alignItems:'center'}}>{children}</div></div>;
function Demo(){
const [n,setN]=React.useState('Carrefour City');const [h,setH]=React.useState(145);const [o,setO]=React.useState('local');
return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
<div style={{display:'flex',flexDirection:'column',gap:14}}><AmountInput value="71" focused/><AmountInput value="450" kind="income"/><FieldCard label="Name" value={n} onChange={setN} placeholder="What was it for?"/><MoneyInput value="450" unit="per month"/><div style={{display:'flex',gap:10}}><MoneyInput size="sm" value="40" suffix="%"/><MoneyInput size="sm" value="32" suffix="€"/></div></div>
<div style={{display:'flex',flexDirection:'column',gap:14}}><ChoiceCard title="On this phone only" body="No account. Your budget stays on this device and works offline." selected={o==='local'} onClick={()=>setO('local')}/><ChoiceCard title="With an account" body="Sync your phone, tablet and desktop." selected={o==='acc'} onClick={()=>setO('acc')}/><HuePicker value={h} onChange={setH}/></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);});
</script></body></html>
