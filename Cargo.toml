[workspace]
resolver = "3"
members = ["crates/*", "tauri-shell"]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Philippe Billard"]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.29" }
thiserror = { version = "2" }

# Wasm boundary (auxide-wasm)
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
serde-wasm-bindgen = "0.6.5"
# `js` converts through serde-wasm-bindgen. The default `json` feature would also pull
# serde_json and gloo-utils into the wasm for nothing.
tsify = { version = "0.5.8", default-features = false, features = ["js"] }

# Desktop shell (auxide-tauri-shell)
tauri = "2"
tauri-build = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[profile.release.package.auxide-wasm]
# Do not "clean this up": stripping drops the wasm custom sections that wasm-bindgen reads
# to generate the JS glue, and the wasm-pack build fails. wasm-pack shrinks the .wasm with
# wasm-opt instead.
strip = false

[workspace.lints.clippy]
# Errors are values: no hidden panics outside tests (tests are allowed through clippy.toml).
unwrap_used = "warn"
# expect_used = "warn"  # enable with F0.14, once the Tauri template code is removed
panic = "warn"
# Money is integer cents everywhere (see CLAUDE.md): no float arithmetic in any crate.
float_arithmetic = "warn"
# Use #[expect(...)] with a reason instead of #[allow(...)].
allow_attributes_without_reason = "warn"
