[workspace]
resolver = "3"
members = ["crates/*", "tauri-shell"]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Philippe Billard"]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[workspace.lints.clippy]