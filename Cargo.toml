[workspace]
resolver = "3"
members = ["crates/*", "tauri-shell"]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Philippe Billard"]
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[workspace.lints.clippy]
# Errors are values: no hidden panics outside tests (tests are allowed through clippy.toml).
unwrap_used = "warn"
# expect_used = "warn"  # enable with F0.14, once the Tauri template code is removed
panic = "warn"
# Money is integer cents everywhere (see CLAUDE.md): no float arithmetic in any crate.
float_arithmetic = "warn"
# Use #[expect(...)] with a reason instead of #[allow(...)].
allow_attributes_without_reason = "warn"
